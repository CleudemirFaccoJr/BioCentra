<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Produtos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/cadastroproduto.css') }}">
</head>

<body>
    <div class="container py-4">
        <div class="main-card">
            <div class="card-header-custom">
                <h4>📦 Produtos do Orçamento</h4>
                <p>Adicione os produtos e suas especificações para gerar o PDF do orçamento</p>
            </div>
            
            <div class="card-body p-4">
                <form method="POST" action="/gerar-orcamento" enctype="multipart/form-data" id="formProdutos">
                    <div id="container-produtos">
                        <!-- Produtos serão adicionados aqui -->
                    </div>

                    <div class="text-center mt-4">
                        <button type="button" class="btn btn-primary-custom" onclick="addProduto()">
                            + Adicionar Produto
                        </button>
                    </div>

                    <div class="action-buttons">
                        <div class="row g-3">
                            <div class="col-md-6">
                                <a href="/" class="w-100">
                                    <button type="button" class="btn btn-secondary-custom w-100">
                                        ← Voltar
                                    </button>
                                </a>
                            </div>
                            <div class="col-md-6">
                                <button type="submit" class="btn btn-success-custom w-100">
                                    ✓ Finalizar e Gerar PDF
                                </button>
                            </div>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script>
        let produtoCount = 0;

        function createProdutoHTML(index) {
            return `
                <div class="produto-card" data-index="${index}">
                    <div class="produto-number">${index + 1}</div>
                    ${index > 0 ? '<button type="button" class="btn-remove" onclick="removeProduto(this)" title="Remover produto">×</button>' : ''}
                    
                    <div class="row g-3">
                        <div class="col-md-3">
                            <label class="form-label">Imagem do Produto</label>
                            <input type="file" class="form-control d-none" name="prod_foto[]" accept="image/*" id="fileInput${index}" onchange="previewImage(this, ${index})">
                            <div class="image-preview" onclick="document.getElementById('fileInput${index}').click()" id="preview${index}">
                                <div class="image-placeholder">
                                    <div style="font-size: 2rem;">📷</div>
                                    <div>Clique para adicionar</div>
                                </div>
                            </div>
                        </div>

                        <div class="col-md-9">
                            <div class="row g-3">
                                <div class="col-md-6">
                                    <label class="form-label">Nome do Produto</label>
                                    <input type="text" class="form-control" name="prod_nome[]" placeholder="Ex: Notebook Dell Inspiron">
                                </div>

                                <div class="col-md-3">
                                    <label class="form-label">Quantidade</label>
                                    <input type="number" class="form-control" name="prod_quant[]" placeholder="0" min="1" value="1">
                                </div>

                                <div class="col-md-3">
                                    <label class="form-label">Valor Unitário</label>
                                    <div class="input-group">
                                        <span class="input-group-text">R$</span>
                                        <input type="number" step="0.01" class="form-control" name="prod_valor[]" oninput="formatarMoeda(this)" placeholder="0,00" min="0">
                                    </div>
                                </div>

                                <div class="col-12">
                                    <label class="form-label">Especificações (Chave;Valor;)</label>
                                    <input type="text" class="form-control" name="prod_specs[]" placeholder="Ex: Cor;Azul;Tamanho;Grande;Peso;1kg">
                                    <small class="text-muted">Separe as especificações com ponto e vírgula. Ex: Chave;Valor;Chave2;Valor2</small>
                                </div>

                                <div class="col-md-4 mt-2">
                                    <label class="form-label">Garantia</label>
                                    <select class="form-select" name="prod_garantia[]">
                                        <option value="6 meses">6 meses</option>
                                        <option value="1 ano" selected>1 ano</option>
                                        <option value="2 anos">2 anos</option>
                                    </select>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        function addProduto() {
            const container = document.getElementById('container-produtos');
            const newProduto = document.createElement('div');
            newProduto.innerHTML = createProdutoHTML(produtoCount);
            container.appendChild(newProduto.firstElementChild);
            produtoCount++;
            updateProdutoNumbers();
        }

        function removeProduto(btn) {
            const card = btn.closest('.produto-card');
            card.style.opacity = '0';
            card.style.transform = 'scale(0.9)';
            setTimeout(() => {
                card.remove();
                updateProdutoNumbers();
            }, 200);
        }

        function updateProdutoNumbers() {
            const produtos = document.querySelectorAll('.produto-card');
            produtos.forEach((produto, index) => {
                const numberBadge = produto.querySelector('.produto-number');
                if (numberBadge) {
                    numberBadge.textContent = index + 1;
                }
            });
        }

        function previewImage(input, index) {
            const preview = document.getElementById('preview' + index);
            const file = input.files[0];
            
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    preview.innerHTML = `<img src="${e.target.result}" alt="Preview">`;
                }
                reader.readAsDataURL(file);
            }
        }

        // Adiciona 3 produtos iniciais
        for (let i = 0; i < 3; i++) {
            addProduto();
        }

        // Função para formatar moeda brasileira
            function formatarMoeda(input) {
                let valor = input.value.replace(/\D/g, '');
                valor = (valor / 100).toFixed(2) + '';
                valor = valor.replace(".", ",");
                valor = valor.replace(/(\d)(\d{3})(\d{3}),/g, "$1.$2.$3,");
                valor = valor.replace(/(\d)(\d{3}),/g, "$1.$2,");
                input.value = valor;
            }
    </script>
</body>
</html>
