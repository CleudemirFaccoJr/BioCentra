<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Configurar Numeração</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container py-5">
        <div class="card shadow mx-auto" style="max-width: 500px;">
            <div class="card-header bg-dark text-white">
                <h4 class="mb-0">Controle de Numeração</h4>
            </div>
            <div class="card-body text-center">
                <p class="lead">Número atual no Banco de Dados: <strong>{{ numero_atual }}</strong></p>
                <form action="/confirmar-numero" method="POST">
                    <div class="mb-3 text-start">
                        <label class="form-label fw-bold">Deseja alterar o próximo número?</label>
                        <input type="number" name="novo_numero" class="form-control" placeholder="Deixe em branco para manter o automático">
                        <small class="text-muted">Se vazio, o sistema usará {{ numero_atual + 1 }}.</small>
                    </div>
                    <button type="submit" class="btn btn-success btn-lg w-100">Avançar para Produtos</button>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
